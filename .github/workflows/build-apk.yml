name: Build Android app

# Runs on every push, and on demand from the Actions tab.
on:
  push:
  workflow_dispatch:

# Needed so the finished files can be attached to a Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK (install this one directly)
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build the AAB (this is what the Play Store takes)
        working-directory: android
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: myapp-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload the AAB
        uses: actions/upload-artifact@v4
        with:
          name: myapp-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # An artifact is a zip only a signed-in GitHub user can fetch. A release
      # asset is a plain link any phone browser can download and install.
      - name: Publish the files as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            android/app/build/outputs/apk/release/*.apk \
            android/app/build/outputs/bundle/release/*.aab \
            --title "My App build ${{ github.run_number }}" \
            --notes "Built by GitHub Actions from the project Lewa Coder generated. Download the .apk to install on a phone; the .aab is for the Play Store."
